<body>
  <main id="app" class="shell" aria-live="polite"></main>
  <div id="toasts" class="toast-area" aria-live="assertive"></div>
  <script src="config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js" defer></script>
  <script>
  (() => {
    "use strict";
    const KLB = (() => {
      const CONFIG = globalThis.KLB_CONFIG || {};
      const CODE_CHARS = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
      const STORAGE_KEY = "klb-market-session";
      const PUSH_ASKED_KEY = "klb-push-asked";
      const $ = (selector, root = document) => root.querySelector(selector);
      const escapeHtml = (value = "") => String(value).replace(/[&<>"']/g, char => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[char]));
      const validName = value => String(value || "").trim().replace(/\s+/g, " ").slice(0, 30);
      const validCode = value => String(value || "").toUpperCase().replace(/[^A-Z2-9]/g, "").slice(0, 6);
      const isValidCode = code => /^[ABCDEFGHJKLMNPQRSTUVWXYZ23456789]{6}$/.test(code);
      const configured = () => Boolean(CONFIG.SUPABASE_URL && CONFIG.SUPABASE_ANON_KEY);
      const demoMode = () => CONFIG.MOCK_MODE === true;
      const state = { session:null, items:[], sharedExpenses:[], personalExpenses:[], boughtOpen:false, activeSection:"market", client:null, channel:null, loading:false };
      const getHashSession = () => {
        const params = new URLSearchParams(location.hash.slice(1));
        const code = validCode(params.get("c"));
        const name = validName(params.get("n"));
        return isValidCode(code) ? { code, name } : null;
      };
      const setSession = session => {
        state.session = session;
        localStorage.setItem(STORAGE_KEY, JSON.stringify(session));
        location.hash = `c=${encodeURIComponent(session.code)}&n=${encodeURIComponent(session.name)}`;
      };
      const cachedSession = () => { try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || "null"); } catch { return null; } };
      const clearSession = () => { localStorage.removeItem(STORAGE_KEY); history.replaceState(null, "", location.pathname + location.search); state.session = null; };
      const humanDate = iso => { try { return new Intl.DateTimeFormat("pt-BR",{day:"2-digit",month:"short",hour:"2-digit",minute:"2-digit"}).format(new Date(iso)); } catch { return ""; } };
      const generateCode = () => Array.from({length:6}, () => CODE_CHARS[Math.floor(Math.random() * CODE_CHARS.length)]).join("");
      const app = () => $("#app");
      let audioContext = null;
      const unlockAudio = () => {
        try {
          const Audio = globalThis.AudioContext || globalThis.webkitAudioContext;
          if (!Audio) return;
          audioContext ||= new Audio();
          if (audioContext.state === "suspended") audioContext.resume().catch(() => {});
        } catch {}
      };
      const playSound = (kind) => {

      };
      const subscribe = () => {
        if (demoMode() || !state.client || state.channel) return;
        state.channel = state.client.channel(`lista-${state.session.code}`)
          .on("postgres_changes",{event:"*",schema:"public",table:"itens_lista",filter:`lista_codigo=eq.${state.session.code}`},() => refreshItems(true))
          .on("postgres_changes",{event:"*",schema:"public",table:"despesas_compartilhadas",filter:`lista_codigo=eq.${state.session.code}`},() => refreshItems(true))
          .on("postgres_changes",{event:"*",schema:"public",table:"despesas_pessoais",filter:`lista_codigo=eq.${state.session.code}`},() => refreshItems(true))
          .subscribe(status => { if (status === "CHANNEL_ERROR") toast("A sincronização caiu. Use atualizar se precisar.", "error"); });
      };
      const urlBase64ToUint8Array = base64String => {
        const padding = "=".repeat((4 - (base64String.length % 4)) % 4);
        const base64 = (base64String + padding).replace(/-/g, "+").replace(/_/g, "/");
        const raw = atob(base64);
        return Uint8Array.from([...raw], char => char.charCodeAt(0));
      };
      const savePushSubscription = async (subscription, session) => {
        if (demoMode() || !configured()) return;
        try {
          const json = subscription.toJSON();
          const row = {
            lista_codigo: session.code,
            nome: session.name,
            endpoint: json.endpoint,
            p256dh: json.keys?.p256dh,
            auth: json.keys?.auth
          };
          if (!row.endpoint || !row.p256dh || !row.auth) return;
          await initClient().from("push_inscricoes").upsert(row, { onConflict: "endpoint" });
        } catch {}
      };
      const ensurePush = async session => {
        if (demoMode() || !configured() || !CONFIG.VAPID_PUBLIC_KEY) return;
        if (!("Notification" in window) || !("serviceWorker" in navigator) || !("PushManager" in window)) return;
        try {
          const registration = await navigator.serviceWorker.ready;
          let permission = Notification.permission;
          if (permission === "default" && !localStorage.getItem(PUSH_ASKED_KEY)) {
            localStorage.setItem(PUSH_ASKED_KEY, "1");
            permission = await Notification.requestPermission();
          }
          if (permission !== "granted") return;
          let subscription = await registration.pushManager.getSubscription();
          if (!subscription) {
            subscription = await registration.pushManager.subscribe({
              userVisibleOnly: true,
              applicationServerKey: urlBase64ToUint8Array(CONFIG.VAPID_PUBLIC_KEY)
            });
          }
          await savePushSubscription(subscription, session);
        } catch {}
      };
      const notifyItemAdded = async (item_nome, quantidade) => {
        if (demoMode() || !state.session) return;
        try {
          await fetch("/api/notify", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              lista_codigo: state.session.code,
              nome: state.session.name,
              item_nome,
              quantidade
            })
          });
        } catch {}
      };
      const disconnect = () => { if (state.channel && state.client) state.client.removeChannel(state.channel); state.channel=null; };
      const openSession = async session => {
        renderLoading();
        try {
          if (!await api.listExists(session.code)) { toast("Não encontramos essa lista. Confira o código.", "error"); clearSession(); renderWelcome(); return; }
          setSession(session); await refreshItems(true); subscribe(); ensurePush(session);
        } catch (error) { renderWelcome(); toast(`Não foi possível abrir a lista: ${error.message || "erro de conexão"}`, "error"); }
      };
      const createList = async () => {
        const name = validName($("#welcome-name")?.value);
        if (name.length < 2) return toast("Conta seu nome para criar a lista.", "error");
        const action = $("[data-action='create-list']"); action.disabled = true;
        try {
          let code, created=false;
          for(let attempt=0;attempt<5 && !created;attempt++) { code=generateCode(); try { await api.createList(code); created=true; } catch(error) { if(attempt===4) throw error; } }
          await openSession({code,name}); toast("Lista criada. Agora é só compartilhar!");
        } catch(error) { toast(`Não conseguimos criar a lista: ${error.message || "tente novamente"}`, "error"); }
        finally { if(action) action.disabled=false; }
      };
      const joinList = async () => {
        const name = validName($("#welcome-name")?.value); const code = validCode($("#join-code")?.value);
        if(name.length<2) return toast("Conta seu nome antes de entrar.", "error");
        if(!isValidCode(code)) return toast("Use um código válido de 6 caracteres.", "error");
        await openSession({code,name});
      };
      const acceptInvite = async () => {
        const name=validName($("#invite-name")?.value); const invite=getHashSession();
        if(name.length<2) return toast("Conta seu nome antes de entrar.", "error");
        if(!invite) return renderWelcome();
        await openSession({code:invite.code,name});
      };
      const addItem = async () => {
        const input=$("#new-item"), qtyInput=$("#new-qty"), name=String(input?.value || "").trim().replace(/\s+/g," ").slice(0,60), quantidade=parseQuantity(qtyInput?.value);
        if(!name) return toast("Escreva algo para adicionar.", "error");
        if(quantidade===null) return toast("Quantidade inválida. Use números como 1 ou 1,5.", "error");
        try { await api.addItem({lista_codigo:state.session.code,nome:name,quantidade,adicionado_por:state.session.name,comprado:false,comprado_por:null}); input.value=""; if(qtyInput) qtyInput.value="1"; await refreshItems(true); playSound("add"); notifyItemAdded(name, quantidade); }
        catch(error) { toast(`Não foi possível adicionar: ${error.message || "tente de novo"}`, "error"); }
      };
      const editItem = async id => {
        const item=state.items.find(current=>current.id===id); if(!item) return;
        const nome=String(prompt("Nome do item:",item.nome) || "").trim().replace(/\s+/g," ").slice(0,60); if(!nome) return;
        const quantidade=parseQuantity(prompt("Quantidade:", formatQuantity(item.quantidade))); if(quantidade===null) return toast("Quantidade inválida.", "error");
        try { await api.updateItem(id,{nome,quantidade}); await refreshItems(true); playSound("add"); toast("Item atualizado."); }
        catch { toast("Não foi possível editar o item.", "error"); }
      };
      const toggleItem = async id => {
        const item=state.items.find(current=>current.id===id); if(!item) return;
        try { await api.updateItem(id,{comprado:!item.comprado,comprado_por:!item.comprado?state.session.name:null}); await refreshItems(true); playSound(item.comprado ? "unmark" : "bought"); }
        catch(error) { toast("Não foi possível atualizar esse item.", "error"); }
      };
      const amountFrom = value => Number(String(value || "").replace(",", "."));
      const addExpense = async personal => {
        const routed=getHashSession();
        if(personal && routed?.name && routed.name!==state.session.name) return toast("Trocando de perfil, aguarde um instante.", "error");
        const prefix=personal?"personal":"shared", descricao=String($(`#${prefix}-description`)?.value||"").trim().replace(/\s+/g," ").slice(0,60), valor=amountFrom($(`#${prefix}-amount`)?.value), data=$(`#${prefix}-date`)?.value;
        const pago_por=personal?state.session.name:validName($("#shared-payer")?.value);
        if(!descricao || !Number.isFinite(valor) || valor<=0 || !/^\d{4}-\d{2}-\d{2}$/.test(data||"") || pago_por.length<2) return toast("Preencha descrição, valor, pessoa e data.", "error");
        try { await api.addExpense(personal?{lista_codigo:state.session.code,dono:state.session.name,descricao,valor,data}:{lista_codigo:state.session.code,descricao,valor,pago_por,data},personal); await refreshItems(true); playSound("add"); toast(personal?"Lançamento pessoal adicionado.":"Gasto da casa adicionado."); }
        catch(error) { toast(`Não foi possível salvar: ${error.message || "tente de novo"}`, "error"); }
      };
      const editExpense = async (id, personal) => {
        const item=(personal?state.personalExpenses:state.sharedExpenses).find(expense=>expense.id===id); if(!item) return;
        const descricao=String(prompt("Descrição do lançamento:",item.descricao) || "").trim().slice(0,60); if(!descricao) return;
        const valor=amountFrom(prompt("Valor em reais:",item.valor)); if(!Number.isFinite(valor)||valor<=0) return toast("Valor inválido.", "error");
        const data=prompt("Data (AAAA-MM-DD):",item.data); if(!/^\d{4}-\d{2}-\d{2}$/.test(data||"")) return toast("Data inválida.", "error");
        const pago_por=personal?null:validName(prompt("Quem pagou?",item.pago_por)); if(!personal&&pago_por.length<2) return toast("Nome inválido.", "error");
        try { await api.updateExpense(id,personal?{descricao,valor,data}:{descricao,valor,data,pago_por},personal); await refreshItems(true); playSound("add"); toast("Lançamento atualizado."); }
        catch { toast("Não foi possível editar o lançamento.", "error"); }
      };
      const share = async () => {
        const url = `${location.origin}${location.pathname}#c=${encodeURIComponent(state.session.code)}`;
        const shareData={title:"KLB Finance Market",text:`Vem organizar mercado e finanças comigo? Entre na minha casa KLB Finance com o código ${state.session.code}.`,url};
        try { if(navigator.share) await navigator.share(shareData); else { await navigator.clipboard.writeText(url); toast("Convite copiado!"); } }
        catch(error) { if(error.name!=="AbortError") { try { await navigator.clipboard.writeText(url); toast("Convite copiado!"); } catch { toast(`Código da lista: ${state.session.code}`); } } }
      };
      const shareSharedReport = async () => {
        const element = document.getElementById("shared-report");
        if (!element || !state.sharedExpenses.length) return toast("Não há gastos para compartilhar.", "error");
        if (!globalThis.html2canvas) return toast("Aguarde o app carregar e tente de novo.", "error");
        try {
          const canvas = await html2canvas(element, { scale: 2, backgroundColor: "#f4f7ff", useCORS: true, logging: false, height: element.scrollHeight, windowHeight: element.scrollHeight });
          const blob = await new Promise(resolve => canvas.toBlob(resolve, "image/png"));
          if (!blob) throw new Error("blob");
          const file = new File([blob], "klb-conta-compartilhada.png", { type: "image/png" });
          if (navigator.share && navigator.canShare?.({ files: [file] })) {
            await navigator.share({ files: [file], title: "KLB Finance — Conta compartilhada" });
            toast("Relatório compartilhado!");
          } else {
            const link = document.createElement("a");
            link.href = URL.createObjectURL(blob);
            link.download = "klb-conta-compartilhada.png";
            link.click();
            URL.revokeObjectURL(link.href);
            toast("Imagem do relatório salva!");
          }
        } catch (error) {
          if (error?.name !== "AbortError") toast("Não foi possível gerar a imagem.", "error");
        }
      };
      const actions = {
        "create-list":createList, "join-list":joinList, "accept-invite":acceptInvite, "add-item":addItem,
        "refresh-list":() => refreshItems(), "nav-market":()=>{state.activeSection="market";renderApp();}, "nav-shared":()=>{state.activeSection="shared";renderApp();}, "nav-personal":()=>{state.activeSection="personal";renderApp();}, "toggle-bought":() => {state.boughtOpen=!state.boughtOpen;renderApp();},
        "toggle-item":button => toggleItem(button.dataset.id), "edit-item":button => editItem(button.dataset.id), "delete-item":async button => { if(confirm("Excluir este item da lista?")) { try { await api.deleteItem(button.dataset.id); await refreshItems(true); playSound("delete"); } catch { toast("Não foi possível excluir esse item.","error"); } } },
        "clear-bought":async () => { if(confirm("Limpar todos os itens comprados?")) { try { await api.clearBought(state.session.code); await refreshItems(true); playSound("clear"); toast("Itens comprados removidos."); } catch { toast("Não foi possível limpar a lista.","error"); } } },
        "edit-expense":button=>editExpense(button.dataset.id,button.dataset.private==="true"), "delete-expense":async button=>{const personal=button.dataset.private==="true";if(confirm("Excluir este lançamento?")){try{await api.deleteExpense(button.dataset.id,personal);await refreshItems(true);playSound("delete");toast("Lançamento excluído.");}catch{toast("Não foi possível excluir o lançamento.","error");}}},
        "share-list":share, "share-shared-report":shareSharedReport, "leave-list":() => { disconnect(); clearSession(); renderWelcome(); toast("Você saiu da lista."); }, "back-home":() => { clearSession(); renderWelcome(); }
      };
      const bindEvents = () => {
        document.addEventListener("click", event => { unlockAudio(); const target=event.target.closest("[data-action]"); if(target) { event.preventDefault(); const action=actions[target.dataset.action]; if(action) action(target); } });
        document.addEventListener("keydown", event => { if(event.key==="Enter" && event.target.matches("[data-enter]")) { unlockAudio(); event.preventDefault(); const action=actions[event.target.dataset.enter]; if(action) action(event.target); } });
        document.addEventListener("submit", event => { if(event.target.matches("[data-form='add-item'],[data-form='add-shared-expense'],[data-form='add-personal-expense']")) { unlockAudio(); event.preventDefault(); if(event.target.dataset.form==="add-item") addItem(); else addExpense(event.target.dataset.form==="add-personal-expense"); } });
        const followHashSession = () => {
          const next=getHashSession();
          if(!next) {
            if(state.session) { disconnect(); state.session=null; state.items=[]; state.sharedExpenses=[]; state.personalExpenses=[]; renderWelcome(); toast("Código da casa inválido.", "error"); }
            return;
          }
          if(state.session && next.code===state.session.code && next.name===state.session.name) return;
          disconnect();
          state.session=null;
          openSession(next);
        };
        window.addEventListener("hashchange", followHashSession);
        window.addEventListener("popstate", followHashSession);
        window.addEventListener("focus", followHashSession);
        document.addEventListener("visibilitychange", () => { if(!document.hidden) followHashSession(); });
        // Alguns navegadores de PWA não disparam hashchange ao voltar do seletor de URL.
        // Esta checagem local não faz rede quando o link não mudou.
        let observedHash=location.hash;
        setInterval(() => {
          if(location.hash!==observedHash) { observedHash=location.hash; followHashSession(); }
        }, 350);
      };
      const start = () => {
        if (!configured() && !demoMode()) return renderConfig();
        initClient();
        const hash=getHashSession(), cache=cachedSession();
        if(hash?.code && !hash.name) return renderInvite(hash.code);
        if(hash?.code && hash.name) return openSession(hash);
        if(cache?.code && cache?.name) return openSession(cache);
        renderWelcome();
      };
      const init = () => { bindEvents(); if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{}); start(); };
      return { init };
    })();
    document.addEventListener("DOMContentLoaded", KLB.init);
  })();
  </script>
</body>
</html>
